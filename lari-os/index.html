
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="LARI.OS — O universo digital de Larissa.">
    <meta name="theme-color" content="#49306C">

    <title>LARI.OS — Personal Operating System</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- TELA DE INICIALIZAÇÃO -->
    <main id="boot-screen" class="boot-screen">

        <div class="boot-content">

            <div class="boot-logo">
                <span>L</span>
            </div>

            <h1>LARI<span>.OS</span></h1>

            <p class="boot-subtitle">
                PERSONAL OPERATING SYSTEM
            </p>

            <div class="loading-container">
                <div class="loading-bar"></div>
            </div>

            <p class="loading-text">
                Inicializando seu universo...
            </p>

        </div>

        <footer>Designed with ♡ by Larissa</footer>

    </main>


    <!-- ÁREA DE TRABALHO -->
    <main id="desktop" class="desktop hidden">

        <div class="desktop-overlay"></div>

        <div class="welcome-message">
            <span class="welcome-tag">YOUR PERSONAL SPACE</span>
            <h1>Olá!</h1>
            <p>Bem-vindo ao mundo de Larissa ♡</p>
        </div>


        <!-- ÍCONES DA ÁREA DE TRABALHO -->
        <div class="desktop-icons">

            <button class="desktop-icon" data-app="about">
                <span>👩🏻‍💻</span>
                <p>Sobre mim</p>
            </button>

            <button class="desktop-icon" data-app="education">
                <span>🎓</span>
                <p>Formação</p>
            </button>

            <button class="desktop-icon" data-app="projects">
                <span>💻</span>
                <p>Projetos</p>
            </button>

            <button class="desktop-icon" data-app="skills">
                <span>🧠</span>
                <p>Habilidades</p>
            </button>

            <button class="desktop-icon" data-app="experience">
                <span>📁</span>
                <p>Experiências</p>
            </button>

            <button class="desktop-icon" data-app="contact">
                <span>💌</span>
                <p>Contato</p>
            </button>

        </div>


        <!-- JANELAS DOS APLICATIVOS -->
        <section id="window-area" class="window-area"></section>


        <!-- MENU INICIAR -->
        <div class="start-menu hidden" id="start-menu">

            <div class="start-header">
                <div>
                    <h2>Olá, Larissa! ♡</h2>
                    <p>O que vamos explorar hoje?</p>
                </div>

                <div class="profile-icon">L</div>
            </div>

            <div class="start-search">
                <span>⌕</span>

                <input
                    type="text"
                    id="app-search"
                    placeholder="Pesquisar aplicativos..."
                    autocomplete="off"
                >
            </div>

            <div class="pinned-header">
                <h3>Aplicativos fixados</h3>
                <span>MEUS APLICATIVOS</span>
            </div>

            <div class="pinned-apps">

                <button class="pinned-app" data-app="about">
                    <span>👩🏻‍💻</span>
                    <p>Sobre mim</p>
                </button>

                <button class="pinned-app" data-app="education">
                    <span>🎓</span>
                    <p>Formação</p>
                </button>

                <button class="pinned-app" data-app="projects">
                    <span>💻</span>
                    <p>Projetos</p>
                </button>

                <button class="pinned-app" data-app="skills">
                    <span>🧠</span>
                    <p>Habilidades</p>
                </button>

                <button class="pinned-app" data-app="experience">
                    <span>📁</span>
                    <p>Experiências</p>
                </button>

                <button class="pinned-app" data-app="contact">
                    <span>💌</span>
                    <p>Contato</p>
                </button>

            </div>

            <div class="start-footer">

                <div class="user-info">
                    <div class="small-profile">L</div>
                    <span>Larissa</span>
                </div>

                <button id="power-button" title="Reiniciar sistema">
                    ⏻
                </button>

            </div>

        </div>


        <!-- BARRA DE TAREFAS -->
        <nav class="taskbar">

            <button class="start-button" id="start-button" title="Menu iniciar">
                ⊞
            </button>

            <div class="taskbar-apps" id="taskbar-apps">
                <span title="LARI.OS">🌸</span>
            </div>

            <div class="taskbar-clock">
                <span id="clock">00:00</span>
                <small id="date">00/00/0000</small>
            </div>

        </nav>

    </main>

    <script src="js/scripts.js"></script>

</body>
</html>
